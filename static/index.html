<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Control Layer</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #f6f3ec; color: #111; margin: 0; padding: 2rem 1rem; }
  main { max-width: 40rem; margin: 0 auto; }
  a { color: #111; }
  code { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>AI Control Layer</h1>
  <p><a href="/opencode-wrapper/">Open the OpenCode wrapper</a>: send a message to an OpenCode agent that runs
    with our control plugin and see what the gateway allows, redacts or blocks.</p>
  <p>Deployed commit: <code id="commit">loading</code></p>
</main>
<script>
fetch("/healthz").then(r => r.json())
  .then(d => { document.getElementById("commit").textContent = d.commit; })
  .catch(() => { document.getElementById("commit").textContent = "unreachable"; });
</script>
</body>
</html>
