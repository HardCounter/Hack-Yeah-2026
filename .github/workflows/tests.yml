name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # minimum from pyproject.toml
      - run: python -m pip install "pytest>=8"
      - name: Generate dataset (self-checks + determinism)
        run: python data/generate.py
      - name: Test suite (Ollama test skips itself here)
        run: python -m pytest
      - name: Report renders
        run: python data/report.py
