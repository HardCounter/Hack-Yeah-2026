name: tests

on:
  push:
    branches: [main]  # PR branches are covered by pull_request; avoids running twice
  pull_request:

concurrency:  # a newer push cancels the stale run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]  # pinned: "latest" images move under us
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global init.defaultBranch main  # silences git's hint inside checkout
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # exact: setup-uv has no floating major tags since v8
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python (.python-version) and locked dependencies
        run: uv sync --locked
      - name: Generate dataset (self-checks + determinism)
        run: uv run python data/generate.py
      - name: Test suite
        run: uv run pytest
      - name: Test frontend and adapter Node suites
        run: node --experimental-vm-modules --test tests/frontend/dashboard.test.mjs adapters/opencode/test.mjs adapters/opencode/forward.test.mjs
      - name: Report renders
        run: uv run python data/report.py
