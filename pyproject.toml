[project]
name = "hack-yeah-2026"
version = "0.1.0"
description = "AI Control Layer for Autonomous Agents"
readme = "README.md"
authors = [
    { name = "HardCounter Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["data", "sim", "simulation", "intercept", "tests"]
pythonpath = ["."]
addopts = "-ra"
