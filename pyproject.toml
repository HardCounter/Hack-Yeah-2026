[project]
name = "hack-yeah-2026"
version = "0.1.0"
description = "AI Control Layer for Autonomous Agents"
readme = "README.md"
authors = [
    { name = "HardCounter Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "google-re2>=1.1.20251105",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["area(code): guardrail area the case is listed under on the dashboard Tests tab"]
