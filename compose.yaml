services:
  app:
    image: hackyeah-app:local
    # Caddy is the only ingress to the web container. Trust forwarded scheme/host headers
    # from that private Compose network so HTTPS browser checks see the public URL.
    command:
      - uvicorn
      - web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file: .env
    environment:
      CONFIG_DIR: /data/config   # saved custom configs survive a redeploy
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Read API for dashboards (docs/rest.md). It has no secrets and cannot write configuration.
  # Reachable inside the network, via Caddy publicly, and directly on host loopback for local dev.
  api:
    image: hackyeah-app:local
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/pipeline-runs/bank-runs &&
        set --; for origin in $${DEV_CORS_ORIGINS}; do set -- "$$@" --cors-origin "$$origin"; done;
        exec python -m persistence.http_api --host 0.0.0.0 --allow-remote --port 8790
        --evidence-dir /data/pipeline-runs/bank-runs --disable-config-writes "$$@"
    environment:
      CONFIG_DIR: /data/config
      DEV_CORS_ORIGINS: "${DEV_CORS_ORIGINS:-http://localhost:5173 http://127.0.0.1:5173}"
    # Local-only direct access for frontend development; Caddy remains the public entry point.
    ports:
      - "127.0.0.1:${API_PORT:-8790}:8790"
    volumes:
      - appdata:/data
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
      - api
    restart: unless-stopped

volumes:
  appdata:
  caddy_data:
