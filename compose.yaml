services:
  app:
    image: hackyeah-app:local
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file: .env
    environment:
      CONFIG_DIR: /data/config   # saved custom configs survive a redeploy
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Read API for dashboards (docs/rest.md). Read-only by design, no credentials: it gets no .env.
  # Reachable only inside this network; Caddy publishes it under /api/v1.
  api:
    image: hackyeah-app:local
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/pipeline-runs/bank-runs &&
        exec python -m persistence.http_api --host 0.0.0.0 --allow-remote --port 8790
        --evidence-dir /data/pipeline-runs/bank-runs
    volumes:
      - appdata:/data
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
      - api
    restart: unless-stopped

volumes:
  appdata:
  caddy_data:
